name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Verify official CLI installation and login environment support
        if: matrix.python == '3.13'
        run: |
          python - <<'PY'
          from unittest.mock import patch
          import subprocess
          from kaggle_vscode.install import ensure_code
          with patch('kaggle_vscode.install.shutil.which', return_value=None):
              code = ensure_code()
          subprocess.run([code, '--version'], check=True)
          subprocess.run([code, 'tunnel', '--help'], check=True)
          result = subprocess.run([code, 'tunnel', 'user', 'login', '--help'],
                                  capture_output=True, text=True, check=True)
          assert 'VSCODE_CLI_ACCESS_TOKEN' in result.stdout
          PY
